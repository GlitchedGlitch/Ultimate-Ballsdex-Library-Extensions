[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ballsdex-collector"
version = "1.0.1"
description = "Collector system package for BallsDex v3."
license = "MIT"
authors = [{ name = "Glitch" }]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/GlitchedGlitch/Ultimate-Ballsdex-Library-Extensions"

[tool.setuptools.packages.find]
where = ["."]
include = ["collector*"]
