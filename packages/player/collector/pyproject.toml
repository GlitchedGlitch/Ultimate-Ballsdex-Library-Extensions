[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Collector"
version = "1.0.1"
description = "Collector system package for BallsDex v3"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Glitch" }]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/GlitchedGlitch/Ultimate-Ballsdex-Library-Extensions"
Package = "https://github.com/GlitchedGlitch/Ultimate-Ballsdex-Library-Extensions/tree/v3/packages/player/collector"

[tool.setuptools.packages.find]
where = ["."]
include = ["collector*"]
