[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ballsdex-spawnrole"
version = "1.0.0"
description = "Spawn role package that allows server managers to set a role that gets pinged every time a ball spawns. Farmers will increase :sob:"
license = "MIT"
authors = [{ name = "Glitch" }]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/GlitchedGlitch/Ultimate-Ballsdex-Library-Extensions"

[tool.setuptools.packages.find]
where = ["."]
include = ["spawnrole*"]
