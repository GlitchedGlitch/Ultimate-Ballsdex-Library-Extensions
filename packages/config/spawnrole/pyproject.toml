[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Spawnrole"
version = "1.1.0-pre"
description = "Spawn role package that allows server managers to set a role that gets pinged every time a ball spawns. Farmers will increase :sob:"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Glitch" }]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/GlitchedGlitch/Ultimate-Ballsdex-Library-Extensions"
Package = "https://github.com/GlitchedGlitch/Ultimate-Ballsdex-Library-Extensions/tree/v3/packages/config/spawnrole"

[tool.setuptools.packages.find]
where = ["."]
include = ["spawnrole*"]
