[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Leave"
version = "1.0.0"
description = "Admin leave server package for BallsDex v3. Allows admins to make the bot leave a specific server in just a few seconds :3"
license = "MIT"
authors = [{ name = "Glitch" }]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/GlitchedGlitch/Ultimate-Ballsdex-Library-Extensions"

[tool.setuptools.packages.find]
where = ["."]
include = ["leave*"]
